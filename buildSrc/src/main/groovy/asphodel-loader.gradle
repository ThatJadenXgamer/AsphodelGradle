plugins {
    id 'java-library'
    id 'idea'
}

def projectName = project.name
def is1201 = projectName.startsWith('1_20_1')

def mcVer = project.property(is1201 ? 'mc_1_20_1' : 'mc_1_21_1').toString()
def javaVer = project.property(is1201 ? 'java_1_20_1' : 'java_1_21_1').toString()

def loader
if (projectName.endsWith('_vanilla')) {
    loader = 'vanilla'
} else if (projectName.endsWith('_fabric')) {
    loader = 'fabric'
} else if (projectName.endsWith('_forge')) {
    loader = 'forge'
} else if (projectName.endsWith('_neoforge')) {
    loader = 'neoforge'
} else {
    throw new GradleException("Cannot determine loader from project name '${projectName}'")
}

def isSharedRoot = projectName == '1_20_1_vanilla'

project.ext.asphodelMcVersion = mcVer
project.ext.asphodelJavaVersion = javaVer
project.ext.asphodelLoader = loader

project.ext.mc = mcVer
project.ext.java = javaVer
project.ext.minecraft_range = project.property(is1201 ? 'minecraft_range_1_20_1' : 'minecraft_range_1_21_1').toString()
project.ext.fabric_loader = project.property(is1201 ? 'fabric_loader_1_20_1' : 'fabric_loader_1_21_1').toString()
project.ext.forge = project.property('forge_1_20_1').toString()
project.ext.forge_range = project.property('forge_range_1_20_1').toString()
project.ext.neoforge = project.property('neoforge_1_21_1').toString()
project.ext.neoforge_range = project.property('neoforge_range_1_21_1').toString()

base {
    archivesName = "${project.mod_id}-${projectName}-${mcVer}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

def versionKey = is1201 ? '1.20.1' : '1.21.1'
def javaSourceDirFile = rootProject.file('src/main/java')
def mainResourceDirFile = rootProject.file('src/main/resources')
def versionJavaDirFile = rootProject.file("src/overlays/${versionKey}/java")
def versionResourceDirFile = rootProject.file("src/overlays/${versionKey}/resources")
def loaderJavaDirFile = rootProject.file("src/overlays/${versionKey}-${loader}/java")
def loaderResourceDirFile = rootProject.file("src/overlays/${versionKey}-${loader}/resources")

def assembleTask = tasks.register('assembleSources', asphodel.gradle.AssembleSourcesTask) {
    javaSourceDirs.from(javaSourceDirFile, versionJavaDirFile, loaderJavaDirFile)
    mainResourcesDir.from(mainResourceDirFile)
    versionResourcesDir.from(versionResourceDirFile)
    loaderResourcesDir.from(loaderResourceDirFile)
    targetLoader.set(loader)
    targetVersion.set(mcVer)
    projectDirectory.set(project.layout.projectDirectory)
    outputJavaDir.set(layout.buildDirectory.dir('generated/assembled/java'))
    outputResourcesDir.set(layout.buildDirectory.dir('generated/assembled/resources'))
    stateFile.set(layout.buildDirectory.file('asphodel/assemble-state.tsv'))
}

sourceSets.main.java.setSrcDirs([])
if (isSharedRoot) {
    sourceSets.main.java.srcDir(javaSourceDirFile)
    sourceSets.main.java.srcDir(versionJavaDirFile)
} else if (loader == 'vanilla') {
    sourceSets.main.java.srcDir(versionJavaDirFile)
} else {
    sourceSets.main.java.srcDir(loaderJavaDirFile)
}

sourceSets.main.resources.setSrcDirs([])
sourceSets.main.resources.srcDir(assembleTask.flatMap { it.outputResourcesDir })

def mergedOutputDir = layout.buildDirectory.dir("classes")
sourceSets.main.output.resourcesDir = mergedOutputDir.get().asFile
sourceSets.main.java.destinationDirectory = mergedOutputDir

tasks.named('compileJava', JavaCompile) {
    dependsOn assembleTask
    source = fileTree(assembleTask.flatMap { it.outputJavaDir })
}

if (!isSharedRoot) {
    dependencies {
        compileOnly project(':1_20_1_vanilla')
    }
}

tasks.named('processResources', ProcessResources) {
    dependsOn assembleTask

    def expandProps = [
            'version', 'group', 'mod_id', 'mod_name', 'mod_author',
            'license', 'credits', 'description',
            'mc', 'java', 'minecraft_range',
            'fabric_loader',
            'forge', 'forge_range',
            'neoforge', 'neoforge_range'
    ].collectEntries { name ->
        [(name): project.property(name).toString()]
    }

    filesMatching([
            'pack.mcmeta',
            'fabric.mod.json',
            'META-INF/mods.toml',
            'META-INF/neoforge.mods.toml',
            '*.mixins.json'
    ]) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.named('sourcesJar', Jar) {
    dependsOn assembleTask
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.mod_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : project.mod_name.toString(),
                'Specification-Vendor'  : project.mod_author.toString(),
                'Specification-Version' : project.version.toString(),
                'Implementation-Title'  : projectName,
                'Implementation-Version': project.version.toString(),
                'Implementation-Vendor' : project.mod_author.toString(),
                'Built-On-Minecraft'    : mcVer
        ])
    }
}